<link rel="stylesheet" href="assets/css/styles.css">
<style>
  body{background:radial-gradient(circle at 50% 0%,#1c1a16,#0c0b09 72%);min-height:100svh}
  .cat-top{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:16px 24px;color:var(--bone)}
  .cat-top a{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-soft)}
  .cat-top a:hover{color:var(--bone)}
  .cat-top img{height:44px;width:auto}

  .stage{min-height:100svh;display:grid;place-items:center;padding:96px 16px 120px}
  .book-wrap{width:100%;max-width:1040px;display:flex;flex-direction:column;align-items:center;gap:28px}
  .book3d{position:relative;width:min(94vw,980px);aspect-ratio:3/2;transform-style:preserve-3d;perspective:2600px}
  #book{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.55,.05,.2,1)}
  #book.at-start{transform:translateX(-25%)}
  #book.at-end{transform:translateX(25%)}
  .leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-style:preserve-3d;
    transform-origin:left center;transition:transform 1s cubic-bezier(.55,.05,.2,1);cursor:pointer}
  .leaf.flipped{transform:rotateY(-180deg)}
  .face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;background:var(--paper);color:var(--ink)}
  .face--front{box-shadow:inset 20px 0 34px -24px rgba(0,0,0,.4)}
  .face--back{transform:rotateY(180deg);box-shadow:inset -20px 0 34px -24px rgba(0,0,0,.4)}
  .face__inner{position:absolute;inset:0;display:flex;flex-direction:column}
  .folio{position:absolute;bottom:14px;font-size:.62rem;letter-spacing:.14em;color:#b3a893}
  .face--front .folio{right:18px}.face--back .folio{left:18px}

  .pg{flex:1;display:flex;flex-direction:column;min-height:0}
  .pg__kicker{font-family:var(--sans);font-size:.58rem;font-weight:600;letter-spacing:.28em;
    text-transform:uppercase;color:var(--bronze)}

  /* página de foto a sangre */
  .pg--photo{background-size:cover;background-position:center;align-items:flex-start;justify-content:flex-end}
  .pg__cap{margin:0;padding:9%;font-family:var(--serif);font-style:italic;font-size:clamp(.95rem,2.6vw,1.35rem);
    color:#fff;background:linear-gradient(to top,rgba(12,11,9,.82),transparent);width:100%}

  /* divisores con foto */
  .pg--divider{align-items:flex-start;justify-content:flex-end;gap:12px;padding:11%;
    background-size:cover;background-position:center;color:var(--bone)}
  .pg--divider .pg__kicker{color:var(--bronze-l)}
  .pg__big{font-family:var(--serif);font-size:clamp(1.8rem,6vw,3rem);color:#fff}
  .pg__sub{font-size:.76rem;line-height:1.6;color:rgba(233,228,218,.82);max-width:32ch;margin:0}
  .pg__rule{width:46px;height:1px;background:var(--bronze-l);margin-top:4px}

  /* material: lámina de la superficie + datos abajo */
  .pg--mat{gap:0;background:var(--paper);justify-content:center}
  .pg__photo{width:86%;margin:0 7% 22px;aspect-ratio:646/216;background:#141210 center/cover no-repeat;flex:none}
  .pg__mbody{display:flex;flex-direction:column;gap:14px;padding:0 7%;flex:none;align-items:flex-start}
  .pg__name{font-family:var(--serif);font-size:clamp(1.15rem,3vw,1.65rem);color:var(--ink);margin:0}
  .pg__line{font-size:.82rem;line-height:1.7;color:var(--ink-soft);margin:0;max-width:32ch}

  /* texto */
  .pg--text{padding:11%;gap:10px}
  .pg__h{font-family:var(--serif);font-size:clamp(1.3rem,3.6vw,2rem);color:var(--ink);margin:.1em 0 .3em;line-height:1.14}
  .pg--text p{font-size:.76rem;line-height:1.62;color:var(--ink-soft);margin:0 0 .5em}
  .pg__sign{font-family:var(--serif);font-style:italic;color:var(--ink);font-size:1rem;margin-top:auto!important}
  .pg__sign span{font-family:var(--sans);font-style:normal;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:#b3a893}
  .pg__toc{list-style:none;padding:0;margin:8px 0 0}
  .pg__toc li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dotted #cdc3af;font-size:.8rem;color:var(--ink-soft)}
  .pg__toc li b{margin-left:auto;font-family:var(--serif);color:var(--bronze)}
  .pg__steps{list-style:none;padding:0;margin:6px 0 0;counter-reset:s}
  .pg__steps li{position:relative;padding:0 0 12px 28px;font-size:.72rem;color:var(--ink-soft)}
  .pg__steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:18px;height:18px;
    border:1px solid var(--bronze);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);color:var(--bronze);font-size:.66rem}
  .pg__steps b{display:block;font-size:.82rem;color:var(--ink);font-family:var(--serif)}
  .pg__facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
  .pg__facts b{display:block;font-family:var(--serif);color:var(--ink);font-size:.95rem}
  .pg__facts span{font-size:.66rem;line-height:1.5;color:var(--ink-soft)}

  .pg__btn{align-self:flex-start;background:var(--bronze);color:#fff;font-size:.62rem;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;padding:.85em 1.3em}
  .pg--text .pg__btn,.pg--cover .pg__btn{margin-top:auto}
  .pg__btn--wa{background:var(--ok)}

  /* portada / contraportada */
  .pg--cover{align-items:center;justify-content:center;text-align:center;gap:14px;padding:12%;
    background:
      radial-gradient(130% 90% at 28% 16%, rgba(214,183,128,.13), transparent 55%),
      linear-gradient(150deg,rgba(255,246,230,.05),rgba(0,0,0,.4) 70%),
      url("assets/img/leather.svg");
    background-size:cover;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), inset 0 0 60px rgba(0,0,0,.4);color:var(--bone)}
  .pg--cover::before{content:"";position:absolute;inset:7%;border-radius:3px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.55), inset 0 0 0 2px rgba(214,183,128,.14);pointer-events:none}
  .pg__t{position:relative;font-size:.56rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(233,228,218,.55)}
  .pg__clogo{position:relative;width:52%;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
  .pg__ctitle{position:relative;font-family:var(--serif);letter-spacing:.14em;color:#F2EEE6;margin:0;font-size:clamp(1.5rem,5vw,2.4rem)}
  .pg__ctag{position:relative;font-family:var(--serif);font-style:italic;color:rgba(233,228,218,.82);font-size:.85rem;margin:0}
  .pg__cline{position:relative;width:54px;height:1px;background:var(--bronze-l);margin:4px 0}
  .pg__cinfo{position:relative;font-size:.78rem;line-height:1.7;color:rgba(233,228,218,.9);margin:0}
  .pg--blank{background:var(--paper)}

  .controls{display:flex;align-items:center;gap:18px;color:var(--bone)}
  .controls button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-d);background:none;
    color:var(--bronze-l);font-size:1.1rem;cursor:pointer;transition:.2s}
  .controls button:hover:not(:disabled){background:var(--bronze);color:#fff;border-color:var(--bronze)}
  .controls button:disabled{opacity:.3;cursor:default}
  #counter{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-soft);min-width:120px;text-align:center}
  .hint{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(154,145,132,.6)}

  @media(max-width:820px){
    .book3d{width:94vw;aspect-ratio:3/4}
    #book{left:0}#book.at-start,#book.at-end{transform:none}
    .leaf{left:0;width:100%}.face--front{box-shadow:none}
    .cat-top{padding:12px 16px}.cat-top img{height:34px}
  }
</style>
</head>

  <img src="assets/img/logo-horizontal-light.svg" alt="GV MÁRMOL">
  <a href="https://wa.me/593988007005?text=Hola%20GV%20M%C3%81RMOL%2C%20vi%20el%20cat%C3%A1logo." target="_blank" rel="noopener">WhatsApp →</a>
